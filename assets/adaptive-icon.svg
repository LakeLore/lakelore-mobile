<!--
  LakeLore Android adaptive-icon foreground — 1024×1024, transparent.
  Android may apply circle/squircle/rounded-square masks; foreground
  content must fit within the central 66% safe zone (~676×676).
  Background color is set in app.json as #f4efe4.

  Design scaled to ~86% of the safe zone (r=290, diameter 580) so the
  medallion has presence under aggressive launcher masks. All strokes
  scale proportionally; the walleye-gold eye stays at a 38px radius so
  it remains legible at small launcher sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Transparent background; Expo uses backgroundColor from app.json. -->

  <!-- Medallion outline -->
  <circle cx="512" cy="512" r="290" stroke="#1a1f2a" stroke-width="13" fill="none"/>

  <!-- Waterline -->
  <line x1="259" y1="589" x2="765" y2="589" stroke="#1a1f2a" stroke-width="11"/>

  <!-- Depth contour (dashed) -->
  <line x1="259" y1="650" x2="765" y2="650" stroke="#1a1f2a" stroke-width="7" stroke-dasharray="15 29"/>

  <!-- Fishing hook -->
  <path d="M408 298 L408 511 Q408 587 484 587 L575 587"
        stroke="#1a1f2a" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Hook barb -->
  <path d="M530 587 L575 587 L560 555"
        stroke="#1a1f2a" stroke-width="17" fill="none" stroke-linecap="round"/>

  <!-- Walleye gold eye -->
  <circle cx="627" cy="392" r="34" fill="#c89a3c"/>
</svg>
