<!--
  LakeLore Play Store feature graphic — 1024×500, cream paper field.
  Left: brand medallion. Right: eyebrow, wordmark, italic tagline,
  state strip (active states only — keep this in sync with
  src/activeStates.ts ACTIVE_STATES).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Cream paper field -->
  <rect width="1024" height="500" fill="#f4efe4"/>

  <!-- Hairline borders top/bottom -->
  <line x1="40" y1="32" x2="984" y2="32" stroke="#1a1f2a" stroke-width="2"/>
  <line x1="40" y1="468" x2="984" y2="468" stroke="#1a1f2a" stroke-width="2" stroke-dasharray="10 14"/>

  <!-- Medallion (left third) -->
  <g transform="translate(192 250)">
    <!-- Outline -->
    <circle cx="0" cy="0" r="138" stroke="#1a1f2a" stroke-width="6" fill="none"/>
    <!-- Waterline -->
    <line x1="-117" y1="38" x2="117" y2="38" stroke="#1a1f2a" stroke-width="5"/>
    <!-- Depth contour (dashed) -->
    <line x1="-117" y1="65" x2="117" y2="65" stroke="#1a1f2a" stroke-width="3" stroke-dasharray="7 13"/>
    <!-- Fishing hook -->
    <path d="M-46 -82 L-46 16 Q-46 50 -10 50 L32 50"
          stroke="#1a1f2a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Hook barb -->
    <path d="M11 50 L32 50 L25 36"
          stroke="#1a1f2a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Walleye gold eye -->
    <circle cx="54" cy="-46" r="15" fill="#c89a3c"/>
  </g>

  <!-- Right column -->
  <g transform="translate(420 0)">
    <!-- Eyebrow: gold pip + small-caps mono -->
    <circle cx="6" cy="135" r="5" fill="#c89a3c"/>
    <text x="22" y="140"
          font-family="JetBrains Mono, Menlo, monospace" font-size="20"
          letter-spacing="2.4" fill="#a67d25">
      NORTHERN GAME FISH · ATLAS
    </text>

    <!-- Wordmark -->
    <text x="0" y="240"
          font-family="Young Serif, Georgia, serif" font-weight="400" font-size="110"
          fill="#1a1f2a">
      LakeLore
    </text>

    <!-- Italic tagline (two lines) -->
    <text x="0" y="310"
          font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="34"
          fill="#3a3f4a">
      Lakes worth fishing —
    </text>
    <text x="0" y="352"
          font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="34"
          fill="#3a3f4a">
      by the numbers.
    </text>

    <!-- State strip + URL -->
    <text x="0" y="430"
          font-family="JetBrains Mono, Menlo, monospace" font-size="17"
          letter-spacing="3" fill="#6a6558">
      MN · SD · ND · NE · IA · LAKELOREAPP.COM
    </text>
  </g>

  <!-- Faint vertical rule between medallion and copy -->
  <line x1="376" y1="120" x2="376" y2="384" stroke="#ded4bd" stroke-width="2"/>
</svg>
